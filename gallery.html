<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#050816;
    color:white;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:35px;
    font-size:38px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
}

.card{
    background:#171b2b;
    border-radius:20px;
    overflow:hidden;
    transition:0.35s;
    box-shadow:0 0 20px rgba(255,255,255,.08);
}

.card:hover{
    transform:translateY(-8px) scale(1.02);
}

.card img{
    width:100%;
    height:340px;
    object-fit:cover;
    display:block;
}

.caption{
    padding:18px;
    text-align:center;
    font-size:22px;
}
</style>

</head>

<body>

<h1>Our Memories ❤️</h1>

<div class="gallery">

<div class="card">
<img src="IMG_20260728_104215_445.jpg" alt="Memory 1">
<div class="caption">❤️ Memory 1</div>
</div>

<div class="card">
<img src="IMG_20260728_104214_066.jpg" alt="Memory 2">
<div class="caption">❤️ Memory 2</div>
</div>

<div class="card">
<img src="IMG_20260728_104212_073.jpg" alt="Memory 3">
<div class="caption">❤️ Memory 3</div>
</div>

</div>

</body>
</html>
