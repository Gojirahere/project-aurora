<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
padding:30px;
}

h1{
text-align:center;
margin-bottom:30px;
font-size:40px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:rgba(255,255,255,.08);
border-radius:20px;
overflow:hidden;
transition:.3s;
box-shadow:0 0 20px rgba(255,255,255,.08);
}

.card:hover{
transform:translateY(-8px) scale(1.02);
}

.card img{
width:100%;
height:340px;
object-fit:cover;
display:block;
}

.caption{
padding:18px;
text-align:center;
font-size:20px;
}

.next-btn{
display:block;
width:220px;
margin:40px auto;
padding:16px;
text-align:center;
text-decoration:none;
background:#ff4d6d;
color:white;
font-size:20px;
border-radius:50px;
transition:.3s;
}

.next-btn:hover{
background:#ff6b8a;
transform:scale(1.05);
}

</style>
</head>

<body>

<h1>Our Memories ❤️</h1>

<div class="gallery">

<div class="card">
<img src="IMG_20260728_104215_445.jpg" alt="Memory 1">
<div class="caption">❤️ Memory 1</div>
</div>

<div class="card">
<img src="IMG_20260728_104214_066.jpg" alt="Memory 2">
<div class="caption">❤️ Memory 2</div>
</div>

<div class="card">
<img src="IMG_20260728_104212_073.jpg" alt="Memory 3">
<div class="caption">❤️ Memory 3</div>
</div>

</div>

<a href="challenge.html" class="next-btn">Continue →</a>

</body>
</html>
