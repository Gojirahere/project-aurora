<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#050816;
    color:white;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:rgba(255,255,255,0.08);
    border-radius:18px;
    overflow:hidden;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.03);
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
    display:block;
}

.caption{
    padding:15px;
    text-align:center;
    font-size:18px;
}
</style>

</head>

<body>

<h1>Our Memories ❤️</h1>

<div class="gallery">

<div class="card">
<img src="images/IMG_20260728_104215_445.jpg" alt="Memory 1">
<div class="caption">❤️ Memory 1</div>
</div>

<div class="card">
<img src="images/IMG_20260728_104214_066.jpg" alt="Memory 2">
<div class="caption">❤️ Memory 2</div>
</div>

<div class="card">
<img src="images/IMG_20260728_104212_073.jpg" alt="Memory 3">
<div class="caption">❤️ Memory 3</div>
</div>

</div>

</body>
</html>
