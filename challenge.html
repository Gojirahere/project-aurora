<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Girlfriend's Day ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">

<style>

/* =========================
RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{

scroll-behavior:smooth;

}

body{

font-family:'Fredoka',sans-serif;

height:100vh;

overflow:hidden;

background:
radial-gradient(circle at top,#1c2255,#0c1028,#050816);

display:flex;

justify-content:center;

align-items:center;

color:white;

}

/* =========================
BACKGROUND
========================= */

#stars{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:0;

}

#shootingStars{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:1;

}

#floatingHearts{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:2;

}

/* =========================
MAIN CARD
========================= */

.container{

position:relative;

z-index:10;

width:92%;

max-width:760px;

padding:45px;

border-radius:35px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.15);

box-shadow:
0 0 60px rgba(255,105,180,.15);

text-align:center;

}

h1{

font-family:'Pacifico',cursive;

font-size:3.2rem;

color:#ff8dc7;

margin-bottom:15px;

}

.subtitle{

font-size:1.2rem;

opacity:.9;

margin-bottom:30px;

}

button{

padding:18px 45px;

border:none;

border-radius:60px;

font-family:'Fredoka',sans-serif;

font-size:20px;

cursor:pointer;

background:linear-gradient(90deg,#ff4d94,#ff87c8);

color:white;

transition:.35s;

}

button:hover{

transform:scale(1.08);

}

#gameArea{

margin-top:35px;

position:relative;

width:100%;

height:420px;

border-radius:25px;

overflow:hidden;

display:none;

background:rgba(255,255,255,.05);

}

#progress{

width:100%;

height:14px;

background:#2d2d44;

border-radius:50px;

overflow:hidden;

margin-bottom:18px;

}

#progressFill{

width:0%;

height:100%;

background:linear-gradient(90deg,#ff5ca8,#ffc1de);

transition:.4s;

}

#message{

font-size:22px;

margin-top:18px;

min-height:35px;

}

/* Continue in Part 1B... */
/* =========================
STARS
========================= */

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
box-shadow:0 0 10px white;
animation:twinkle 3s infinite;
}

@keyframes twinkle{

0%,100%{
opacity:.25;
transform:scale(.7);
}

50%{
opacity:1;
transform:scale(1.8);
}

}

/* =========================
SHOOTING STARS
========================= */

.shootingStar{

position:absolute;

width:140px;

height:2px;

background:linear-gradient(90deg,#fff,transparent);

transform:rotate(-35deg);

animation:shoot 4s linear infinite;

opacity:.9;

}

@keyframes shoot{

0%{

transform:translate(-250px,-150px) rotate(-35deg);

opacity:0;

}

10%{

opacity:1;

}

100%{

transform:translate(1700px,900px) rotate(-35deg);

opacity:0;

}

}

/* =========================
FLOATING HEARTS
========================= */

.floatHeart{

position:absolute;

font-size:20px;

animation:floatHeart linear infinite;

opacity:.8;

}

@keyframes floatHeart{

0%{

transform:translateY(120vh) scale(.6);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh) scale(1.2);

opacity:0;

}

}

/* =========================
MOON
========================= */

.moon{

position:fixed;

top:45px;

right:60px;

width:90px;

height:90px;

border-radius:50%;

background:#fff8cf;

box-shadow:
0 0 20px white,
0 0 60px #fff5aa,
0 0 100px white;

animation:moonGlow 4s infinite;

z-index:2;

}

@keyframes moonGlow{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.08);

}

}

/* =========================
TITLE
========================= */

h1{

animation:titleFloat 3s ease-in-out infinite;

text-shadow:
0 0 10px hotpink,
0 0 25px deeppink;

}

@keyframes titleFloat{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-8px);

}

}

.subtitle{

color:#f4ddee;

line-height:1.6;

}

/* =========================
BUTTON
========================= */

button:hover{

box-shadow:
0 0 25px hotpink,
0 0 45px deeppink;

}

/* Continue in Part 1C... */
 /* =========================
CHERRY BLOSSOMS
========================= */

.petal{

position:absolute;

font-size:18px;

opacity:.8;

animation:petalFall linear infinite;

}

@keyframes petalFall{

0%{

transform:translateY(-120px) rotate(0deg);

opacity:0;

}

15%{

opacity:1;

}

100%{

transform:translateY(120vh) rotate(360deg);

opacity:0;

}

}

/* =========================
HELPER
========================= */

#helper{

position:absolute;

width:75px;

height:75px;

bottom:20px;

left:20px;

z-index:50;

cursor:pointer;

transition:1s;

display:none;

}

#helper img{

width:100%;

height:100%;

object-fit:contain;

}

#speech{

position:absolute;

bottom:85px;

left:-15px;

background:white;

color:#ff4d94;

padding:8px 14px;

border-radius:15px;

font-size:14px;

font-weight:bold;

display:none;

white-space:nowrap;

box-shadow:0 5px 15px rgba(0,0,0,.25);

}

/* =========================
RESPONSIVE
========================= */

@media(max-width:700px){

.container{

padding:25px;

}

h1{

font-size:2.3rem;

}

.subtitle{

font-size:1rem;

}

button{

font-size:18px;

padding:15px 35px;

}

#gameArea{

height:360px;

}

}

</style>

</head>

<body>

<div id="stars"></div>

<div id="shootingStars"></div>

<div id="floatingHearts"></div>

<div class="moon"></div>

<div class="container">

<h1>Happy Girlfriend's Day ❤️</h1>

<p class="subtitle">
I made a tiny adventure just for you...
</p>

<button id="startBtn">
Begin Mission ❤️
</button>

<div id="progress">

<div id="progressFill"></div>

</div>

<div id="message">
Press Begin Mission ❤️
</div>

<div id="gameArea">

<div id="helper">

<img id="kittyImg" src="kitty.png" alt="Helper">

<div id="speech">
Hi! 💕
</div>

</div>

</div>

</div>

<script>
