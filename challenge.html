<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Girlfriend's Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<style>
 /* ===========================
   RESET
=========================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Fredoka',sans-serif;

height:100vh;

overflow:hidden;

background:linear-gradient(180deg,#050816,#09122b,#140b26);

display:flex;

justify-content:center;

align-items:center;

color:white;

}

/* ===========================
   STARS
=========================== */

#stars{

position:fixed;

left:0;

top:0;

width:100%;

height:100%;

overflow:hidden;

z-index:0;

}

.star{

position:absolute;

width:3px;

height:3px;

background:white;

border-radius:50%;

animation:twinkle 3s infinite;

box-shadow:0 0 10px white;

}

@keyframes twinkle{

0%,100%{

opacity:.2;

transform:scale(.8);

}

50%{

opacity:1;

transform:scale(1.8);

}

}

/* ===========================
   FLOATING HEARTS
=========================== */

#floatingHearts{

position:fixed;

width:100%;

height:100%;

overflow:hidden;

pointer-events:none;

z-index:1;

}

.floatHeart{

position:absolute;

font-size:22px;

animation:floatHeart linear infinite;

opacity:.8;

}

@keyframes floatHeart{

0%{

transform:translateY(110vh) scale(.7);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh) scale(1.2);

opacity:0;

}

}

/* ===========================
   MOON
=========================== */

.moon{

position:absolute;

top:50px;

right:70px;

width:90px;

height:90px;

border-radius:50%;

background:#fff7d6;

box-shadow:

0 0 20px white,

0 0 50px #fff9b0,

0 0 90px white;

animation:moonGlow 4s infinite;

z-index:2;

}

@keyframes moonGlow{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.08);

}

}

/* ===========================
   MAIN CONTAINER
=========================== */

.container{

position:relative;

z-index:5;

text-align:center;

width:90%;

max-width:700px;

padding:40px;

border-radius:25px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.12);

box-shadow:0 0 40px rgba(255,255,255,.08);

}

h1{

font-size:3rem;

color:#ff8ac6;

text-shadow:

0 0 10px #ff8ac6,

0 0 25px hotpink;

animation:titleFloat 3s infinite;

}

@keyframes titleFloat{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-8px);

}

}

.subtitle{

margin-top:15px;

font-size:1.2rem;

color:#ddd;

}

/* ===========================
   BUTTON
=========================== */

#startBtn{

margin-top:35px;

padding:16px 40px;

font-size:20px;

font-family:'Fredoka',sans-serif;

border:none;

border-radius:50px;

background:linear-gradient(90deg,#ff4f95,#ff79c6);

color:white;

cursor:pointer;

transition:.3s;

box-shadow:0 0 25px hotpink;

}

#startBtn:hover{

transform:scale(1.08);

box-shadow:0 0 45px hotpink;

}

/* ===========================
   GAME AREA
=========================== */

#gameArea{

margin-top:35px;

}

#progress{

width:100%;

height:16px;

background:#333;

border-radius:20px;

overflow:hidden;

margin-bottom:20px;

}

#progressFill{

width:0%;

height:100%;

background:linear-gradient(90deg,#ff5ca8,#ffb3d9);

transition:.5s;

}

#message{

font-size:22px;

color:#fff;

min-height:50px;

}
 </style>

 </head>

<body>

<div id="stars"></div>

<div id="floatingHearts"></div>

<div class="moon"></div>

<div class="container">

<h1>Happy Girlfriend's Day ❤️</h1>

<p class="subtitle">
I made a tiny adventure just for you...
</p>

<button id="startBtn">
Begin Mission ❤️
</button>

<div id="gameArea">

<div id="progress">
<div id="progressFill"></div>
</div>

<div id="message">
Press Begin Mission ❤️
</div>

</div>

</div>

<script>

// ===== CREATE STARS =====

const stars=document.getElementById("stars");

for(let i=0;i<220;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

star.style.animationDelay=Math.random()*3+"s";

star.style.animationDuration=(2+Math.random()*3)+"s";

stars.appendChild(star);

}

// ===== FLOATING HEARTS =====

const floating=document.getElementById("floatingHearts");

function createFloatingHeart(){

let heart=document.createElement("div");

heart.className="floatHeart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(6+Math.random()*6)+"s";

heart.style.fontSize=(18+Math.random()*22)+"px";

floating.appendChild(heart);

setTimeout(()=>{

heart.remove();

},12000);

}

setInterval(createFloatingHeart,700);
// =======================================
// PART 2A - HEART HUNT SYSTEM
// =======================================

const startBtn = document.getElementById("startBtn");
const gameArea = document.getElementById("gameArea");
const message = document.getElementById("message");
const progressFill = document.getElementById("progressFill");

let heartsFound = 0;

const funnyMessages = [

"😂 Nope... that's not a heart!",

"🙄 Wrong place detective.",

"💀 The heart isn't hiding THERE.",

"🤣 Nice try!",

"💕 You're getting warmer...",

"🎀 Keep looking!",

"✨ Almost..."

];

const heartLocations=[

{top:"20%",left:"18%"},

{top:"35%",left:"75%"},

{top:"68%",left:"32%"},

{top:"60%",left:"82%"},

{top:"82%",left:"56%"},

{top:"44%",left:"12%"},

{top:"12%",left:"56%"}

];

startBtn.onclick=function(){

this.style.display="none";

message.innerHTML="❤️ Find all 7 hidden hearts!";

spawnHearts();

};

function spawnHearts(){

heartLocations.forEach((pos,index)=>{

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.position="absolute";

heart.style.top=pos.top;

heart.style.left=pos.left;

heart.style.fontSize="34px";

heart.style.cursor="pointer";

heart.style.zIndex="50";

heart.onclick=function(){

this.remove();

heartsFound++;

progressFill.style.width=(heartsFound/7)*100+"%";

message.innerHTML="❤️ Hearts Found: "+heartsFound+"/7";

if(heartsFound==7){

setTimeout(()=>{

message.innerHTML="🎉 Mission Complete!";

},800);

}

};

gameArea.appendChild(heart);

});

}

document.body.addEventListener("click",function(e){

if(e.target.className!="heart" && e.target.id!="startBtn"){

message.innerHTML=funnyMessages[Math.floor(Math.random()*funnyMessages.length)];

}

});
</script>

</body>

</html>
