<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(180deg,#050816,#09122a,#102040);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

.card{
width:90%;
max-width:650px;
padding:45px;
border-radius:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
text-align:center;
animation:fade 2s;
}

h1{
font-size:45px;
margin-bottom:20px;
}

#typing{
font-size:20px;
line-height:1.8;
min-height:90px;
}

button{
margin-top:30px;
padding:15px 40px;
border:none;
border-radius:40px;
background:#ff5ca8;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

@keyframes fade{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="card">

<h1>Hey Sunvi ❤️</h1>

<p id="typing"></p>

<button onclick="nextPage()">
Begin the Journey →
</button>

</div>

<script>

const text="I made something for you...\nNot because I had to.\nBecause every memory with you deserves a place of its own.";

let i=0;

function type(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i);

i++;

setTimeout(type,45);

}

}

type();

function nextPage(){

alert("Mission Begins ✨");

}

// Stars

const canvas=document.getElementById("stars");

const ctx=canvas.getContext("2d");

canvas.width=innerWidth;

canvas.height=innerHeight;

let stars=[];

for(let i=0;i<160;i++){

stars.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

r:Math.random()*2

});

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

stars.forEach(s=>{

ctx.beginPath();

ctx.arc(s.x,s.y,s.r,0,Math.PI*2);

ctx.fill();

s.y+=0.3;

if(s.y>canvas.height)s.y=0;

});

requestAnimationFrame(draw);

}

draw();

</script>

</body>
</html>
